<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Fans in Parallel and Series Explorer using Plotly</title>
    <link rel="stylesheet" href="../shared-libs/fanpedia-sim.css">
    <style>
        .pse-lead { font-size: var(--fp-size-secondary); margin: 0 0 6px 0; }
        .pse-draw { padding: 4px 6px 0 6px; }
        .pse-plot { width: 100%; height: 340px; background: var(--fp-ctrl-bg); }
        .pse-plot.narrow { height: 250px; }
        .pse-caption { caption-side: top; text-align: left; font-size: var(--fp-size-note); color: var(--fp-text-muted); }
        .pse-draw .fp-note { margin: 2px 0 4px 0; }
        .pse-ctrl .fp-row { margin: 6px 0; }
        .pse-ctrl .fp-prompt { margin: 4px 0; }
        .pse-ctrl .fp-feedback { margin: 6px 0; }
        .pse-qnum { font-size: var(--fp-size-secondary); color: var(--fp-text-muted); }
        .pse-group { font-weight: bold; }
        .pse-ctrl #answers > .fp-row { margin: 0 12px 0 0; }
        button.pse-chosen:disabled { border: 2px solid var(--fp-primary-dark); color: var(--fp-text); font-weight: bold; }
        .pse-table { border-collapse: collapse; font-size: var(--fp-size-secondary); margin: 4px 0; width: 100%; max-width: 640px; }
        .pse-table th, .pse-table td { border: 1px solid var(--fp-border); padding: 3px 6px; text-align: left; }
        .pse-table th { background: var(--fp-primary-bg); }
        .pse-table td.pse-cur { outline: 2px solid var(--fp-primary-dark); outline-offset: -2px; font-weight: bold; }
        .pse-readout { font-weight: bold; margin: 4px 0; }
        @media (max-width: 480px) {
            .pse-table { font-size: var(--fp-size-note); }
            .pse-table th, .pse-table td { padding: 2px 3px; }
        }
    </style>
    <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
    <script src="../shared-libs/fanpedia-core.js"></script>
    <script src="../shared-libs/chart-theme.js"></script>
    <script src="../shared-libs/fan-curves.js"></script>
    <script src="ch25-parallel-series-explorer.js" defer></script>
</head>
<body>
    <main class="fp-app">
        <h1 class="fp-title">Fans in Parallel and Series Explorer</h1>
        <p class="pse-lead" id="lead"></p>

        <section class="fp-draw pse-draw" id="drawing" aria-label="Fan curves, combined curves and system curve with operating points">
            <div class="pse-plot" id="plot"></div>
            <p class="fp-note illustrative" id="dataNote"></p>
        </section>

        <section class="fp-ctrl pse-ctrl" aria-label="Predictions and exploration">
            <div class="fp-row">
                <span class="fp-score" id="score"></span>
                <div id="progress" class="fp-progress" aria-label="Progress"></div>
                <span class="pse-qnum" id="qnum"></span>
            </div>
            <p class="fp-prompt" id="prompt"></p>
            <div class="fp-row" id="answers"></div>
            <div id="feedback" class="fp-feedback" role="status"></div>
            <div id="readout"></div>
            <p class="fp-note" id="keys"></p>
        </section>
    </main>
    <a class="fp-back" href=".">Back to Lesson Plan</a>
</body>
</html>
