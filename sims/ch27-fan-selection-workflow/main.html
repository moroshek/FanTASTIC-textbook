<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Fan Selection Workflow using Mermaid</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; overflow: hidden; }
        body { font-family: Arial, Helvetica, sans-serif; color: #1e293b; background: #ffffff; }
        main { display: flex; width: 100%; align-items: stretch; }
        .diagram-panel { flex: 0 0 62%; background: aliceblue; padding: 6px 4px 8px 4px; overflow: visible; }
        .info-panel { flex: 1 1 38%; background: #f8fafc; border-left: 1px solid #cbd5e1; padding: 8px 10px; position: relative; overflow: visible; }
        h1 { font-size: 18px; margin: 2px 4px 4px 4px; }
        .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; margin: 0 4px 2px 4px; }
        .legend span { display: inline-flex; align-items: center; gap: 4px; }
        .legend i { display: inline-block; width: 13px; height: 13px; border: 1px solid #475569; border-radius: 2px; }
        #diagram { text-align: center; }
        #diagram svg { max-width: 100%; height: auto; }
        #diagram .node { cursor: pointer; }
        h2 { font-size: 16px; margin: 2px 0 6px 0; }
        .progress { display: flex; gap: 4px; margin-bottom: 6px; }
        .progress b { flex: 1; height: 8px; border-radius: 4px; background: #e2e8f0; }
        .progress b.cur { background: #94a3b8; }
        .progress b.ok { background: #16a34a; }
        .progress b.no { background: #dc2626; }
        .card { background: #fffbeb; border: 1px solid #f59e0b; border-radius: 6px; padding: 8px; font-size: 15px; line-height: 1.35; min-height: 62px; }
        .card-num { font-size: 12px; color: #92400e; font-weight: bold; margin-bottom: 3px; }
        .prompt { font-size: 14px; font-weight: bold; margin: 8px 0 4px 0; }
        select { width: 100%; font-size: 14px; padding: 4px; }
        .row { display: flex; gap: 6px; margin-top: 6px; }
        button { font-size: 14px; padding: 5px 10px; cursor: pointer; border: 1px solid #334155; border-radius: 4px; background: #1e40af; color: #ffffff; }
        button:disabled { background: #cbd5e1; color: #64748b; border-color: #cbd5e1; cursor: default; }
        button.secondary { background: #ffffff; color: #1e293b; }
        .feedback { font-size: 14px; line-height: 1.4; margin-top: 8px; padding: 7px; border-radius: 5px; display: none; }
        .feedback.ok { display: block; background: #dcfce7; border: 1px solid #16a34a; }
        .feedback.no { display: block; background: #fee2e2; border: 1px solid #dc2626; }
        .feedback.final { display: block; background: #e0f2fe; border: 1px solid #0284c7; }
        .feedback a { color: #1d4ed8; }
        #stepInfoWrap { position: static; }
        #stepInfo { position: absolute; left: 10px; right: 10px; top: 250px; background: #ffffff; border: 1px solid #1d4ed8; border-radius: 6px; padding: 8px; font-size: 14px; line-height: 1.4; }
        #stepInfo .si-title { font-weight: bold; color: #1d4ed8; margin-bottom: 3px; }
        .hint { color: #475569; font-size: 13px; }
        .back { font-size: 13px; margin: 0 8px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
    <script src="ch27-fan-selection-workflow.js"></script>
</head>
<body>
    <main>
        <section class="diagram-panel">
            <h1>Fan Selection Workflow</h1>
            <div class="legend" aria-label="Color key">
                <span><i style="background:#dbeafe"></i>Define the duty</span>
                <span><i style="background:#ede9fe"></i>Choose the fan</span>
                <span><i style="background:#fef3c7"></i>Configure it</span>
                <span><i style="background:#ccfbf1"></i>Prove and compare</span>
                <span><i style="background:#fce7f3"></i>Document</span>
            </div>
            <div id="diagram" aria-label="Twelve-step fan selection flowchart. Click a step to read what it does."></div>
        </section>
        <section class="info-panel">
            <h2>Which step uses it?</h2>
            <div class="progress" id="progress"></div>
            <div class="card">
                <div class="card-num" id="cardNum">Card 1 of 8</div>
                <div id="cardText"></div>
            </div>
            <div class="prompt" id="prompt">Which step uses this information?</div>
            <select id="stepSelect" aria-label="Workflow step"></select>
            <div class="row">
                <button id="submitBtn" disabled>Submit</button>
                <button id="nextBtn" class="secondary" style="display:none">Next card</button>
                <button id="restartBtn" class="secondary" style="display:none">Restart</button>
            </div>
            <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
            <div id="stepInfoWrap">
                <div id="stepInfo"><span class="hint">Click any step in the flowchart to read what it does.</span></div>
            </div>
        </section>
    </main>
    <div class="back"><a href=".">Back to Lesson Plan</a></div>
</body>
</html>
