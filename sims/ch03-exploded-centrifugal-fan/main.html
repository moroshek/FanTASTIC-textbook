<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Exploded View of a Belt-Driven Centrifugal Fan using html</title>
    <link rel="stylesheet" href="../shared-libs/fanpedia-sim.css">
    <style>
        /* Sim-specific styles (prefix xcf-). Colours come from the kit's --fp-* tokens. */
        main.xcf-app { max-width: 800px; margin: 0 auto; padding: 6px 8px 4px; }
        .xcf-draw { position: relative; border-radius: var(--fp-radius); }
        .xcf-draw svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
        .xcf-draw .fp-note { margin: 0; padding: 0 8px 3px; }
        .xcf-part { transition: transform 0.9s ease-in-out; }
        .xcf-lbl { pointer-events: none; }
        .xcf-lbl rect { fill: #ffffff; stroke: var(--fp-text-muted); stroke-width: 1; }
        .xcf-lbl text { font-size: 16.5px; fill: var(--fp-text); font-family: var(--fp-font); }
        .xcf-lbl line { stroke: var(--fp-text-muted); stroke-width: 1.2; }
        .xcf-lbl circle { fill: var(--fp-text-muted); }
        .xcf-lbl.fp-cq-label-visited rect { fill: var(--fp-primary-bg); stroke: var(--fp-primary); }
        .xcf-lbl.fp-cq-label-selected rect { fill: var(--fp-primary-bg); stroke: var(--fp-primary); stroke-width: 2.5; }
        .xcf-lbl.fp-cq-label-selected text { font-weight: bold; }
        .xcf-inset rect { fill: #ffffff; stroke: var(--fp-text-muted); stroke-dasharray: 5 4; }
        .xcf-inset text { font-size: 16px; fill: var(--fp-text-muted); font-family: var(--fp-font); }
        /* Assembled view: labels and visited marks are hidden (labels show only exploded). */
        .xcf-assembled .xcf-lbl { opacity: 0; }
        .xcf-assembled .fp-cq-marks { display: none; }
        .xcf-keys { margin: 4px 0 0 0; }
        /* Work-around for a kit cascade gap: the kit's button :hover rule outranks its
           aria-pressed rules, so a hovered toggle went dark-on-dark. Keep the toggle readable. */
        .xcf-app button[aria-pressed]:hover:not(:disabled) { background: var(--fp-primary-bg); color: var(--fp-primary-dark); }
    </style>
    <script src="../shared-libs/fanpedia-core.js"></script>
    <script src="../shared-libs/callout-quiz.js"></script>
    <script src="ch03-exploded-centrifugal-fan.js" defer></script>
</head>
<body>
    <main class="fp-app xcf-app">
        <h1 class="fp-title">Belt-driven SWSI centrifugal fan, Arrangement 9</h1>
        <section class="fp-draw xcf-draw" id="drawing" aria-label="Exploded view of a belt-driven centrifugal fan. Select a part.">
            <!-- the SVG drawing is built by the sim -->
            <p class="fp-note illustrative" id="dataNote">Simplified schematic, not to scale · Source: <i>FanPedia</i>, page 10 (exploded view, Arrangement 9)</p>
        </section>
        <p class="fp-note xcf-keys">Keyboard: Tab moves between parts and buttons; Enter or Space selects a part; after an answer, Enter goes to the next prompt.</p>
    </main>
    <a class="fp-back" href=".">Back to Lesson Plan</a>
</body>
</html>
