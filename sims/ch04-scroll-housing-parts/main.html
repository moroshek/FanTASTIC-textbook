<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Parts of a Centrifugal Scroll Housing using html</title>
    <link rel="stylesheet" href="../shared-libs/fanpedia-sim.css">
    <style>
        /* Sim-specific styles (prefix shp-). Colours come from the kit's --fp-* tokens. */
        main.shp-app { max-width: 820px; margin: 0 auto; padding: 6px 8px 4px; }
        .shp-draw { position: relative; border-radius: var(--fp-radius); }
        .shp-draw svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
        .shp-draw .fp-note { margin: 0; padding: 0 8px 3px; }
        /* Hotspot outlines: every part is outlined (dashed) so the learner can see what is clickable. */
        .shp-hot { fill: transparent; stroke: var(--fp-primary); stroke-width: 1.4; stroke-dasharray: 5 4; opacity: 0.75; }
        .shp-found .shp-hot { stroke-dasharray: none; stroke-width: 2.2; opacity: 1; }
        .shp-lbl { pointer-events: none; }
        .shp-lbl rect { fill: #ffffff; stroke: var(--fp-text-muted); stroke-width: 1; }
        .shp-lbl text { font-size: 17px; fill: var(--fp-text); font-family: var(--fp-font); }
        .shp-lbl line { stroke: var(--fp-text-muted); stroke-width: 1.2; }
        .shp-lbl circle { fill: var(--fp-text-muted); }
        .shp-lbl.fp-cq-label-visited rect { fill: var(--fp-primary-bg); stroke: var(--fp-primary); }
        .shp-lbl.fp-cq-label-selected rect { fill: var(--fp-primary-bg); stroke: var(--fp-primary); stroke-width: 2.5; }
        .shp-lbl.fp-cq-label-selected text { font-weight: bold; }
        .shp-cap { font-size: 15px; fill: var(--fp-text-muted); font-family: var(--fp-font); }
        .shp-cap-b { font-weight: bold; fill: var(--fp-text); }
        /* Narrow drawings: numbered callouts plus a key list, so callout text never drops below 12 px. */
        .shp-lbl .shp-num { display: none; }
        .shp-narrow .shp-lbl .shp-full { display: none; }
        .shp-narrow .shp-lbl .shp-num { display: inline; font-size: 30px; font-weight: bold; }
        .shp-narrow-only { display: none; }
        .shp-narrow .shp-wide { display: none; }
        .shp-narrow .shp-narrow-only { display: inline; font-size: 30px; }
        .shp-key { display: none; margin: 4px 0 0; padding: 0 6px; list-style: none; font-size: 14px; min-height: 2.6em; }
        .shp-narrow .shp-key { display: flex; flex-wrap: wrap; gap: 2px 12px; }
        .shp-key li.fp-cq-label-selected { font-weight: bold; color: var(--fp-primary-dark); }
        .shp-key b { display: inline-block; min-width: 1.4em; }
        .shp-keys { margin: 4px 0 0 0; }
    </style>
    <script src="../shared-libs/fanpedia-core.js"></script>
    <script src="../shared-libs/callout-quiz.js"></script>
    <script src="ch04-scroll-housing-parts.js" defer></script>
</head>
<body>
    <main class="fp-app shp-app">
        <h1 class="fp-title">Parts of a Centrifugal Scroll Housing</h1>
        <section class="fp-draw shp-draw" id="drawing" aria-label="Single width, single inlet housed centrifugal fan seen from the inlet side, with part of the side sheet cut away to show the impeller, and an inset section through the inlet. Select a part.">
            <!-- the SVG drawing is built by the sim -->
            <ol class="shp-key" id="key" aria-label="Callout key"></ol>
            <p class="fp-note illustrative" id="dataNote">Simplified illustration, not to scale · Based on FanPedia pp. 59–60 (SWSI housing)</p>
        </section>
        <p class="fp-note shp-keys">Keyboard: Tab moves between parts and buttons; Enter or Space selects a part; after an answer, Enter goes to the next part.</p>
    </main>
    <a class="fp-back" href=".">Back to Lesson Plan</a>
</body>
</html>
