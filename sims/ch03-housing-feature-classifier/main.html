    <title>Which Housing Feature Does the Job? using p5.js</title>
    <link rel="stylesheet" href="../shared-libs/fanpedia-sim.css">
    <style>
        .hfc-summary { overflow-y: auto; background: #ffffff; border: 1px solid var(--fp-border);
                       border-radius: 6px; padding: 4px 10px; box-sizing: border-box; font-size: 14px; }
        .hfc-summary p { margin: 6px 0; padding-left: 8px; line-height: 1.35; }
        .hfc-summary p.ok { border-left: 3px solid var(--fp-correct); }
        .hfc-summary p.ok2 { border-left: 3px dotted var(--fp-correct); }
        .hfc-summary p.bad { border-left: 3px dashed var(--fp-incorrect); }
        button.hfc-ok, button.hfc-ok:disabled { border: 2px solid var(--fp-correct); background: var(--fp-correct-bg);
                                               color: var(--fp-correct); font-weight: bold; opacity: 1; }
        button.hfc-bad, button.hfc-bad:disabled { border: 2px dashed var(--fp-incorrect); background: var(--fp-incorrect-bg);
                                                 color: var(--fp-incorrect); opacity: 1; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.js"></script>

    <script src="../shared-libs/fanpedia-p5.js"></script>
